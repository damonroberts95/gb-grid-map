name: app
# Builds the public, keyless macOS app (Apple Silicon) and publishes it to the "app-latest" release.
# Runs when app-level files change (the rest ships via the update bundle), or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - SHELL_VERSION
      - pyproject.toml
      - uv.lock
      - packaging/**
      - .github/workflows/app.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - name: Native tools
        run: brew install tippecanoe pmtiles
      - name: Web deps
        run: cd web && npm ci
      - name: Build keyless app
        env: { NO_KEYS: "1", TOOLS_DIR: /opt/homebrew/bin }
        run: bash packaging/build_app.sh
      - name: Check no keys are bundled
        run: |
          if find "dist/GB Grid.app" -name 'keys.env' -o -name '.env' | grep -q .; then echo "keys found in app"; exit 1; fi
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest dist/GB-Grid-mac.zip dist/README-FIRST.txt \
            --title "GB Grid app (Mac, Apple Silicon)" --latest \
            --notes "Apple Silicon Macs only. Easiest install: paste the Terminal command from the repo README. Or download GB-Grid-mac.zip and follow README-FIRST.txt (macOS blocks the first open: use System Settings, Privacy & Security, Open Anyway)."
