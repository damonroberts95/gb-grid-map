  - {<<: *npg, id: npg_service_areas, dataset: substation_combined_service_areas, category: boundary, cadence: 7d, format: geojson}
  - {<<: *npg, id: npg_ltds_app3_circuits, dataset: ltds-appendix-3, category: ltds_other, cadence: 30d, gated: true, note: "LTDS appendix 3 circuit data; registered, not mapped (no schema table)"}
  - {<<: *npg, id: npg_ltds_app4_transformers, dataset: ltds-appendix-4, category: ltds_other, cadence: 30d, gated: true, note: "LTDS appendix 4 transformer data; registered, not mapped (no schema table)"}
  - {<<: *npg, id: npg_ltds_app5_load, dataset: ltds-appendix-5, category: ltds_other, cadence: 30d, gated: true, note: "LTDS appendix 5 load information; registered, not mapped"}
  - {<<: *npg, id: npg_ltds_app6_fault, dataset: ltds-appendix-6, category: ltds_fault, cadence: 30d, gated: true, note: "LTDS appendix 6 fault level data -> fault_level"}
  - {<<: *npg, id: npg_ltds_app7_generation, dataset: ltds-appendix-7, category: ltds_other, cadence: 30d, gated: true, note: "LTDS appendix 7 generation (connected/contracted) -> queue_project"}
  - {<<: *npg, id: npg_ecr_1mw_plus, dataset: embedded-capacity-register, category: ecr, cadence: 1d}
  - {<<: *npg, id: npg_ecr_under_1mw, dataset: embedded-capacity-register-part-2, category: ecr, cadence: 1d}
  - {<<: *npg, id: npg_queue, dataset: connection-queue-information, category: queue, cadence: 1d}
  - {<<: *npg, id: npg_gsp_connection_info, dataset: grid-supply-point-connection-information, category: queue, cadence: 7d}
  - {<<: *npg, id: npg_gsp_appendix_g, dataset: gsp-appendix-g-information, category: queue, cadence: 7d}
  - {<<: *npg, id: npg_large_scale_demand, dataset: large-scale-demand, category: queue, cadence: 7d}
  - {<<: *npg, id: npg_historical_peak_demand, dataset: historical-peak-demand, category: ltds_other, cadence: 7d}
  - {<<: *npg, id: npg_load_indices, dataset: northern-powergrid-load-indices, category: ltds_other, cadence: 7d}
