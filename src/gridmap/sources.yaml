  - {<<: *ukpn, id: ukpn_smart_meter_substation, dataset: ukpn-smart-meter-consumption-substation, category: lv_usage, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_lct_secondary, dataset: ukpn-low-carbon-technologies-secondary, category: lct, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_lct_primary, dataset: low-carbon-technologies, category: lct, cadence: 7d, gated: true}
