# Source registry for the fetch framework. Dataset ids come from docs/sources/*.md and are
# checked against live catalogs (never invent ids). Fields:
#   gated: known to need an account key -> skipped with 'needs_key' when auth_env is unset
#          (Opendatasoft also checks catalog `data_visible` at run time, so this is only a hint).
#   large: skipped unless --include-large (>200 MB or millions of rows).
#   cadence: how often to re-check; change detection (portal `modified`) applies at >= 1d.
defaults:
  ukpn: &ukpn {operator: UKPN, portal: opendatasoft, base_url: "https://ukpowernetworks.opendatasoft.com", auth_env: UKPN_API_KEY, licence: "CC BY 4.0", attribution: "Contains data from the UK Power Networks Open Data Portal, licensed under CC BY 4.0."}
  npg: &npg {operator: NPG, portal: opendatasoft, base_url: "https://northernpowergrid.opendatasoft.com", auth_env: NPG_API_KEY, licence: "Northern Powergrid Open Data Licence v1.0", attribution: "Contains data (c) Northern Powergrid, used under the Northern Powergrid Open Data Licence v1.0."}
  enw: &enw {operator: ENW, portal: opendatasoft, base_url: "https://electricitynorthwest.opendatasoft.com", auth_env: ENW_API_KEY, licence: "CC BY 4.0 (some datasets: SP ENW Shared Licence)", attribution: "Contains data from SP Energy Networks (Electricity North West) open data portal, licensed under CC BY 4.0."}
  spen: &spen {operator: SPEN, portal: opendatasoft, base_url: "https://spenergynetworks.opendatasoft.com", auth_env: SPEN_API_KEY, licence: "CC BY 4.0", attribution: "Contains data from the SP Energy Networks open data portal, licensed under CC BY 4.0."}
  nged: &nged {operator: NGED, portal: ckan, base_url: "https://connecteddata.nationalgrid.co.uk", auth_env: NGED_API_KEY, licence: "NGED (WPD) Open Data Licence", attribution: "Contains data (c) National Grid Electricity Distribution, used under the NGED (WPD) Open Data Licence."}
  ssen: &ssen {operator: SSEN, portal: ckan, base_url: "https://data-api.ssen.co.uk", auth_env: null, licence: "CC BY 4.0", attribution: "Contains data from the SSEN Distribution data portal, licensed under CC BY 4.0."}
  ssent: &ssent {operator: SSEN-T, portal: opendatasoft, base_url: "https://ssentransmission.opendatasoft.com", auth_env: SSENT_API_KEY, licence: "CC BY 4.0", attribution: "Contains data from the SSEN Transmission open data portal, licensed under CC BY 4.0."}
  neso: &neso {operator: NESO, portal: ckan, base_url: "https://api.neso.energy", licence: "NESO Open Data Licence", attribution: "Supported by National Energy SO Open Data"}
  elexon: &elexon {operator: ELEXON, portal: http, base_url: "https://data.elexon.co.uk/bmrs/api/v1", format: json, rows_path: data, licence: "BSC open licence (Elexon)", attribution: "Contains BMRS data (c) Elexon Limited copyright and database right."}
  carbon: &carbon {operator: CARBON, portal: http, base_url: "https://api.carbonintensity.org.uk", format: json, rows_path: data, licence: "CC BY 4.0", attribution: "Carbon Intensity API (carbonintensity.org.uk), National Energy SO, CC BY 4.0."}

sources:
  # ---------------------------------------------------------------- UKPN
