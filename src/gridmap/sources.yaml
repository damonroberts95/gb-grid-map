  - {<<: *ukpn, id: ukpn_ltds_t1_circuits, dataset: ukpn-ltds-table-1-circuit-data, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t2a_transformers, dataset: ukpn-ltds-table-2a-transformer-2w, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t2b_transformers, dataset: ukpn-ltds-table-2b-transformer-data-3w, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t3a_load_observed, dataset: ukpn-ltds-table-3a-load-data-observed, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t3b_load_true, dataset: ukpn-ltds-table-3b-load-data-true, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t5_generation, dataset: ukpn-ltds-table-5-generation, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t6_connections_interest, dataset: ukpn-ltds-table-6-interest-connections, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t7_restrictions, dataset: ukpn-ltds-table-7-operational-restrictions, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ltds_t8_fault_gt95, dataset: ukpn-ltds-table-8-gt-95-perc-fault-data, category: ltds_other, cadence: 7d, gated: true}
  - {<<: *ukpn, id: ukpn_ecr_part2_1mw_plus, dataset: ukpn-embedded-capacity-register, category: ecr, cadence: 1d, gated: true}
  - {<<: *ukpn, id: ukpn_ecr_part1_under_1mw, dataset: ukpn-embedded-capacity-register-1-under-1mw, category: ecr, cadence: 1d, gated: true}
  - {<<: *ukpn, id: ukpn_queue_overall_insights, dataset: ukpn-overall-queue-insights, category: queue, cadence: 1d, note: "aggregate MW by technology/status"}
