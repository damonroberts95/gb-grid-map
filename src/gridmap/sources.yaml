  - {<<: *ukpn, id: ukpn_gsp_areas, dataset: ukpn-grid-supply-points, category: boundary, cadence: 7d, gated: true, format: geojson}
  - {<<: *ukpn, id: ukpn_secondary_areas, dataset: ukpn_secondary_postcode_area, category: boundary, cadence: 7d, gated: true, format: geojson, large: true, note: "74k polygons"}
