  - {<<: *enw, id: enw_substations_gis, dataset: enwl-substation, category: sites, cadence: 7d, gated: true, note: "41k rows incl. distribution; 6-digit number key"}
  - {<<: *enw, id: enw_gsp_polygons, dataset: enwl-substation-gsp-polygons, category: boundary, cadence: 7d, gated: true, format: geojson}
  - {<<: *enw, id: enw_bsp_polygons, dataset: enwl-substation-bsp-polygons, category: boundary, cadence: 7d, gated: true, format: geojson}
