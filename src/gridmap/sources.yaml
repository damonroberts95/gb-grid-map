  - {<<: *ukpn, id: ukpn_flex_lv_zones, dataset: ukpn-lv-flex-zones, category: flex, cadence: 7d, format: geojson}
  - {<<: *ukpn, id: ukpn_flex_hv_zones, dataset: ukpn-hv-flex-zones, category: flex, cadence: 7d, gated: true, format: geojson}

