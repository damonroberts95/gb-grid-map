# LV extras (lv_monitored, lv_smart, lv_headroom_forecast). Same schema as sources.yaml; anchors are not
# shared across files, so the portal defaults are repeated. Sources already in sources.yaml (enw_lv_headroom_*,
# spen_lv_monitor, ukpn_smart_meter_*, enw_smart_meter_installation, spen_smart_meter_transformer) are reused.
sources:
  - id: npg_lv_monitor_deployment
    operator: NPG
    portal: opendatasoft
    base_url: "https://northernpowergrid.opendatasoft.com"
    dataset: lv-monitor-deployment-strategy
    category: lv_usage
    cadence: 7d
    core: true
    gated: true
    auth_env: NPG_API_KEY
    licence: "Northern Powergrid Open Data Licence v1.0"
    attribution: "Contains data (c) Northern Powergrid, used under the Northern Powergrid Open Data Licence v1.0."
    note: "15k LV substations with monitor deployment status / utilisation / geopoint"
  - id: nged_lv_monitor_list
    operator: NGED
    portal: http
    base_url: "https://connecteddata.nationalgrid.co.uk/api/3/action/package_show"
    params: {id: lv-load-monitor-data}
    format: json
    rows_path: result.resources
    category: lv_usage
    cadence: 7d
    core: true
    licence: "NGED (WPD) Open Data Licence"
    attribution: "Contains data (c) National Grid Electricity Distribution, used under the NGED (WPD) Open Data Licence."
    note: "CKAN package metadata only: each resource is named by the monitored secondary substation number. The half-hourly CSVs themselves are not downloaded."
  - id: enw_lv_peak_demand_monitored
    operator: ENW
    portal: opendatasoft
    base_url: "https://electricitynorthwest.opendatasoft.com"
    dataset: dfes-lv-peak-demand-monitored
    category: lv_usage
    cadence: 7d
    core: true
    gated: true
    auth_env: ENW_API_KEY
    licence: "CC BY 4.0 (some datasets: SP ENW Shared Licence)"
    attribution: "Contains data from SP Energy Networks (Electricity North West) open data portal, licensed under CC BY 4.0."
  - id: ssen_sm_gql
    operator: SSEN
    portal: ssen_gql
    base_url: "https://gql.internal.datopian.com/v1/graphql"
    params: {day: "2024-09-04"}
    category: lv_usage
    cadence: 30d
    max_mb: 200
    keep: 1
    licence: "CC BY 4.0"
    attribution: "Contains data from the SSEN Distribution data portal, licensed under CC BY 4.0."
    note: "SSEN smart-meter LV feeder consumption via GraphQL (POST, Hasura over BigQuery), fetched by fetch/ssen_gql.py: feeder x postcode lookup + half-hourly usage for params.day (~40 MB gz, ~200 requests at <=2/s). Uses the ssen_smart_meter_dev_* tables (data ends 2024-09-05, static); the ssen_smart_meter_prod_* tables return BigQuery 403. max_mb only raises the wall-clock limit to 60 min."
  - id: spen_smart_consumption_wirral_agg
    operator: SPEN
    portal: smart_agg
    base_url: "https://spenergynetworks.opendatasoft.com"
    dataset: spm-aggregated-smart-consumption-wirral-feeder-level
    select: {kind: ods}
    category: lv_usage
    cadence: 30d
    gated: true
    auth_env: SPEN_API_KEY
    max_mb: 1500
    keep: 1
    licence: "CC BY 4.0"
    attribution: "Contains data from the SP Energy Networks open data portal, licensed under CC BY 4.0."
    note: "Half-hourly feeder consumption, Wirral. Grouped on the portal, streamed and reduced to one row per secondary substation (agg.parquet)."
  - id: spen_smart_consumption_ayrshire_agg
    operator: SPEN
    portal: smart_agg
    base_url: "https://spenergynetworks.opendatasoft.com"
    dataset: spd-aggregated-smart-consumption-ayrshire-clyde-south-feeder-level
    select: {kind: ods}
    category: lv_usage
    cadence: 30d
    gated: true
    auth_env: SPEN_API_KEY
    max_mb: 1500
    keep: 1
    licence: "CC BY 4.0"
    attribution: "Contains data from the SP Energy Networks open data portal, licensed under CC BY 4.0."
    note: "Half-hourly feeder consumption, Ayrshire and Clyde South. Same reduction as the Wirral source."
  - id: nged_smart_meter_secondary_agg
    operator: NGED
    portal: smart_agg
    base_url: "https://connecteddata.nationalgrid.co.uk"
    dataset: aggregated-smart-meter-data-secondary-substation
    select: {kind: ckan_parts}
    category: lv_usage
    cadence: 30d
    gated: true
    auth_env: NGED_API_KEY
    max_mb: 1500
    keep: 1
    licence: "NGED (WPD) Open Data Licence"
    attribution: "Contains data (c) National Grid Electricity Distribution, used under the NGED (WPD) Open Data Licence."
    note: "Newest month only: ~88 gz parts, ~520 MB in total, downloaded one at a time (0.3 s apart) and each reduced to a partial parquet; nothing raw is kept. Result is one row per secondary substation (agg.parquet)."
  - id: os_codepoint
    operator: OTHER
    portal: http
    base_url: "https://api.os.uk/downloads/v1/products/CodePointOpen/downloads"
    params: {area: GB, format: CSV, redirect: ""}
    format: file
    category: context
    cadence: 90d
    max_mb: 100
    licence: "Open Government Licence v3.0"
    attribution: "Contains OS data (c) Crown copyright and database right. Code-Point Open, OGL v3."
    note: "Postcode unit centroids (BNG eastings/northings), used to place SSEN smart-meter feeders (lv_smart)."
  - id: nged_lv_monitor_latest
    operator: NGED
    portal: ckan
    base_url: "https://connecteddata.nationalgrid.co.uk"
    dataset: lv-load-monitor-data
    mode: latest
    select: {format: CSV}
    category: lv_usage
    cadence: 7d
    gated: true
    auth_env: NGED_API_KEY
    timeout_s: 3600  # ~300 datastore calls, 5-10 min; slow under load
    keep: 1
    licence: "NGED (WPD) Open Data Licence"
    attribution: "Contains data (c) National Grid Electricity Distribution, used under the NGED (WPD) Open Data Licence."
    note: "Newest 10-minute reading per monitored substation (299 resources, 1.6 GB as CSV) via datastore_search, one request each (~1 to 3 s, sorted by Timestamp; max_mb only raises the 15 min wall-clock limit to 60). Files hold 10-minute busbar, feeder and transformer-temperature rows, Jan to mid Apr 2026. Reduced to latest.json, read by the server for the LV panel."
