# Network lines extra (extra/lines.py): OSM power infrastructure + DNO-published overhead line GIS.
sources:
  - id: osm_gb_pbf
    operator: OSM
    portal: http
    base_url: "https://download.geofabrik.de/europe/great-britain-latest.osm.pbf"
    format: file
    category: lines
    cadence: 30d
    large: false
    max_mb: 4000
    keep: 1
    licence: "ODbL 1.0"
    attribution: "© OpenStreetMap contributors (ODbL)"
    note: "Geofabrik Great Britain extract (2.2 GB). Uses max_mb: 4000 to exceed the default 200 MB fetch cap; refreshes monthly. Only power=* features are used (osmium tags-filter)."
  - id: ukpn_oh_132kv
    operator: UKPN
    portal: opendatasoft
    base_url: "https://ukpowernetworks.opendatasoft.com"
    dataset: ukpn-132kv-overhead-lines
    category: lines
    cadence: 30d
    format: geojson
    gated: true
    auth_env: UKPN_API_KEY
    licence: "CC BY 4.0"
    attribution: "Contains data from the UK Power Networks Open Data Portal, licensed under CC BY 4.0."
    note: "132 kV overhead line routes"
