# NIE Networks (Northern Ireland) Opendatasoft portal. All 20 datasets report data_visible=false anonymously:
# exports are header-only. Needs a free account API key in NIE_API_KEY (verified working 2026-11-25).
sources:
  - id: nie_sites_grid_bulk_primary
    operator: NIE
    portal: opendatasoft
    base_url: "https://nienetworks.opendatasoft.com"
    dataset: nie-networks-assets-sites-grid-bulk-and-primary-sites
    category: sites
    cadence: 7d
    licence: "CC BY 4.0"
    attribution: "Contains data from the NIE Networks open data portal, licensed under CC BY 4.0."
    auth_env: NIE_API_KEY
    gated: true
    note: "All GSP/BSP/primary sites in one table; anonymous export is header-only (data_visible=false)"
  - id: nie_secondary_transformers
    operator: NIE
    portal: opendatasoft
    base_url: "https://nienetworks.opendatasoft.com"
    dataset: nie-networks-assets-secondary-transformers
    category: lv_sites
    cadence: 7d
    licence: "CC BY 4.0"
    attribution: "Contains data from the NIE Networks open data portal, licensed under CC BY 4.0."
    auth_env: NIE_API_KEY
    gated: true
    note: "Secondary transformers; same gating"
  - id: nie_network_faults
    operator: NIE
    portal: opendatasoft
    base_url: "https://nienetworks.opendatasoft.com"
    dataset: nie-networks-network-faults
    category: outage
    cadence: 30m
    licence: "CC BY 4.0"
    attribution: "Contains data from the NIE Networks open data portal, licensed under CC BY 4.0."
    auth_env: NIE_API_KEY
    gated: true
    note: "Live outages, refreshed c.30 min; same gating"
